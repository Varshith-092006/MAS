provider:
  name: "gemini"
  base_url: "https://generativelanguage.googleapis.com/v1beta/openai/"
  default_free_model: "__SET_BENCH_MODEL_IN_ENV__"
  daily_request_limit: 500
  requests_per_minute: 12
  tokens_per_minute: 200000
  daily_token_limit: null
  safety_margin: 0.10
  quota_timezone: "America/Los_Angeles"

models:
  main: "__SET_BENCH_MODEL_IN_ENV__"
  cheap: "__SET_BENCH_MODEL_IN_ENV__"
  reviewer: "__SET_BENCH_MODEL_IN_ENV__"
  temperature: 0
  seed: 42

router:
  simple_max: 3

limits:
  max_tokens_per_run: 100000
  # Per-call output cap, identical for MAS, single-agent and ChatDev (proxy). 4000 truncated
  # multi-file answers from the Lite model in the pilot run (DEC-044).
  max_output_tokens: 8192
  run_timeout_minutes: 20
  sandbox_execution_timeout_seconds: 45

adaptive:
  weights:
    internal_test: 0.30
    ruff: 0.10
    
    bandit: 0.15
    radon: 0.10
    reviewer: 0.15
    ce: 0.20
  stop_epsilon: 0.02
  patience: 2
  max_iterations: 3

benchmark:
  # Benchmark series. Bump it whenever system code or prompts change during the benchmark, so
  # runs from different code versions are never mixed. Rows without a series are 'v1'
  # (the Phase 8 pilot run). Official rows, --resume and reports are all scoped to a series.
  series: "v2"

database:
  url: "sqlite:///./mas.db"

proxy:
  host: "127.0.0.1"
  port: 8089

sandbox:
  image: "python:3.11-slim"
  memory_limit: "512m"
  cpu_limit: 1.0
  pids_limit: 64
  network: "none"

eval:
  consistency_max_code_chars: 2000

ablation:
  current: "A0"
  a1_disable_router: false
  a2_disable_slicing: false
  a3_disable_grounded_review: false
  a4_single_iteration: false

quality_improvements:
  delimiter_blocks: true
  deterministic_repair: true
  skip_unnecessary_review: true
  test_driven_repair: true
  prompt_hygiene: true
  call_budget_optimization: true
  # Phase 8: Tester builds its report from real execution (smoke, --help, placeholder scan,
  # developer-written pytest) with zero LLM calls. false = legacy LLM-written TestReport.
  deterministic_tester: true



